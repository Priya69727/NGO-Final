# PostgreSQL for local development (started automatically by `python start.py`).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ngo_app
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: ngo_management
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ngo_app -d ngo_management"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
